<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="1; url=https://kekoyana.github.io/gamelist/">
  <title>ゲーム一覧へ移動しました</title>
  <script>
    const games = new Set([
      'civrush', 'royal-rummy'
    ]);
    const game = location.pathname.match(/^\/output_games\/([^/]+)(?:\/|$)/)?.[1];
    const destination = games.has(game)
      ? `https://kekoyana.github.io/gamelist/games/${game}/`
      : 'https://kekoyana.github.io/gamelist/';
    location.replace(destination);
  </script>
</head>
<body>
  <p>ゲームの公開先は <a href="https://kekoyana.github.io/gamelist/">gamelist</a> に移動しました。</p>
</body>
</html>
