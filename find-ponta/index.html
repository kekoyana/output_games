<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Find Ponta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a0f24; }
    #game-root {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }
    #game-root canvas { display: block; touch-action: none; }

    /* スマホ横持ち警告（短辺 <= 500px の landscape のみ表示） */
    #rotate-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #1a0f24;
      color: #ffd966;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      gap: 18px;
    }
    #rotate-overlay .icon {
      font-size: 64px;
      animation: rotate-hint 1.8s ease-in-out infinite;
      transform-origin: center;
    }
    #rotate-overlay .title { font-size: 22px; font-weight: bold; }
    #rotate-overlay .sub { font-size: 14px; color: #c8a6ff; line-height: 1.5; }
    @keyframes rotate-hint {
      0%, 30% { transform: rotate(-90deg); }
      60%, 100% { transform: rotate(0deg); }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #rotate-overlay { display: flex; }
    }

    /* PC でリサイズ時の再起動案内（簡易） */
    #reload-hint {
      display: none;
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 9998;
      background: rgba(74, 42, 106, 0.9);
      color: #ffd966;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    #reload-hint.show { display: block; }
  </style>
</head>
<body>
  <div id="game-root"></div>
  <div id="rotate-overlay" role="alert" aria-live="polite">
    <div class="icon">📱</div>
    <div class="title">Please rotate to portrait</div>
    <div class="sub">画面を縦向きにしてください</div>
  </div>
  <div id="reload-hint" onclick="location.reload()">↻ Window resized — click to reload for new layout</div>
  <script>
    // 起動時のサイズと現在サイズが大きく変わったら（縦/横モードが変わるくらい）reload を促す
    (function () {
      var initW = window.innerWidth;
      var initH = window.innerHeight;
      function classify(w, h) {
        var s = Math.min(w, h);
        if (s < 500) return "portrait";
        return (w / h) >= 1.3 ? "landscape" : "portrait";
      }
      var initMode = classify(initW, initH);
      window.addEventListener("resize", function () {
        var nowMode = classify(window.innerWidth, window.innerHeight);
        var hint = document.getElementById("reload-hint");
        if (hint) hint.classList.toggle("show", nowMode !== initMode);
      });
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
